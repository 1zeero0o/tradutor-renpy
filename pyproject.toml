[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradutor-renpy"
version = "0.1.0"
description = "Extrator e editor desktop de traduções para jogos Ren'Py e arquivos YAML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "ruamel.yaml>=0.18.10,<0.19"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4,<5", "ruff>=0.9,<1", "build>=1,<2"]
bundle = ["pyinstaller>=6.11,<7"]

[project.scripts]
renpy-translator = "renpy_translator.launcher:main"
renpy-translator-cli = "renpy_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"renpy_translator._vendor.unrpyc" = ["LICENSE", "ORIGIN.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/renpy_translator/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/renpy_translator/gui.py" = ["E501", "B008"]
